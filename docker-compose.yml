services:
  bot:
    build: .
    container_name: titanbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      CLIENT_ID: ${CLIENT_ID}
      GUILD_ID: ${GUILD_ID}
      MONGODB_URI: ${MONGODB_URI:-mongodb://${MONGODB_USER:-titanbot}:${MONGODB_PASSWORD:-titanbot}@mongo:27017/${MONGODB_DB_NAME:-titanbot}?authSource=admin}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-titanbot}
      AUTO_MIGRATE: "true"
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      LAVALINK_NODES_FILE: lavalink/nodes.json
      PORT: "3000"
      WEB_HOST: 0.0.0.0
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - titan-network

  lavalink:
    profiles:
      - local-lavalink
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: titanbot-lavalink
    restart: unless-stopped
    environment:
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
    networks:
      - titan-network

  mongo:
    image: mongo:8.0
    container_name: titanbot-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-titanbot}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-titanbot}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - titan-network

networks:
  titan-network:
    driver: bridge

volumes:
  mongodb_data:
