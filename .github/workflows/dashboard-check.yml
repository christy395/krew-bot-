name: Bot syntax checks

on:
  push:
    branches: [dashboard-api]
  pull_request:
    branches: [remove-gambling-migrate-mongodb]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check:syntax
