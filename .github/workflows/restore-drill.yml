name: MongoDB Restore Drill

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: titanbot
          MONGO_INITDB_ROOT_PASSWORD: titanbot
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --username titanbot --password titanbot --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://titanbot:titanbot@localhost:27017/titanbot?authSource=admin
      MONGODB_DB_NAME: titanbot
      BACKUP_RETENTION_DAYS: "7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Apply MongoDB indexes and schema ledger
        run: npm run migrate
      - name: Run MongoDB restore drill
        run: npm run backup:drill
