name: MongoDB Migration Check

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - mitchwork
      - remove-gambling-migrate-mongodb

jobs:
  migration-check:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: titanbot
          MONGO_INITDB_ROOT_PASSWORD: titanbot
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --username titanbot --password titanbot --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://titanbot:titanbot@localhost:27017/titanbot?authSource=admin
      MONGODB_DB_NAME: titanbot
      SCHEMA_VERSION: "1"
      SCHEMA_VERSION_LABEL: "baseline-v1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Apply MongoDB indexes and schema ledger
        run: npm run migrate
      - name: Validate MongoDB schema version
        run: npm run migrate:check
      - name: Preview legacy key migration
        run: npm run migrate:keys:dry
