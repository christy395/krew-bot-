name: PostgreSQL Migration Check

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dashboard-api
      - remove-gambling-migrate-mongodb

jobs:
  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: krew
          POSTGRES_PASSWORD: krew_test_password
          POSTGRES_DB: krew_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U krew -d krew_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://krew:krew_test_password@localhost:5432/krew_test
      SCHEMA_VERSION: "1"
      SCHEMA_VERSION_LABEL: "baseline-v1"
      AUTO_MIGRATE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Apply PostgreSQL tables and schema ledger
        run: npm run migrate
      - name: Validate PostgreSQL schema version
        run: npm run migrate:check
      - name: Preview legacy key migration
        run: npm run migrate:keys:dry
